<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Illustrated preview of the Anirudh Bompada personal site homepage">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07121b"/>
      <stop offset="100%" stop-color="#04090f"/>
    </linearGradient>
    <radialGradient id="glow" cx="83%" cy="10%" r="72%">
      <stop offset="0%" stop-color="#123b3d" stop-opacity=".64"/>
      <stop offset="100%" stop-color="#07121b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101f2b"/>
      <stop offset="100%" stop-color="#07111b"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#2b4652" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" rx="28" fill="#04080e"/>
  <rect x="20" y="20" width="1240" height="680" rx="20" fill="url(#sky)" stroke="#254352" stroke-width="2"/>
  <rect x="21" y="21" width="1238" height="678" rx="19" fill="url(#glow)"/>
  <rect x="22" y="22" width="1236" height="676" rx="19" fill="url(#grid)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif">
