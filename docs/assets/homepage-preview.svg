    <text x="68" y="285" fill="#eef5f7" font-size="70" font-weight="800" letter-spacing="-2.5">Turning</text>
    <text x="68" y="365" fill="#eef5f7" font-size="70" font-weight="800" letter-spacing="-2.5">complex data</text>
    <text x="68" y="445" fill="#eef5f7" font-size="70" font-weight="800" letter-spacing="-2.5">into <tspan fill="#54e6d1">clear</tspan></text>
    <text x="68" y="525" fill="#54e6d1" font-size="70" font-weight="800" letter-spacing="-2.5">systems.</text>

    <text x="71" y="566" fill="#b9c9ce" font-size="15.5">Databricks, PySpark, Azure, and Microsoft Fabric.</text>
    <text x="71" y="590" fill="#b9c9ce" font-size="15.5">Practical local AI through hands-on benchmarking.</text>

